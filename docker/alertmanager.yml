# Alertmanager routing for the Docker setup.
# Prometheus evaluates alerts.yml and sends firing alerts here; this file decides
# who gets them. The webhook receiver (app-changes/cmd/webhook) runs on the host.
global:
  resolve_timeout: 1m

route:
  receiver: default            # anything that matches no child route
  group_by: [alertname, job]   # alerts with the same name+job arrive as one notification
  group_wait: 10s              # wait this long to collect alerts of a new group
  group_interval: 1m           # wait this long before notifying about new alerts in a group
  repeat_interval: 1h          # re-send a still-firing alert this often
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      group_wait: 5s
      repeat_interval: 15m
    - matchers: [severity="warning"]
      receiver: warning

# A critical alert silences warnings that carry the same job label
# (for example AppDown hides GoroutineLeak while the app is down).
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [job]

receivers:
  - name: default
    webhook_configs:
      - url: http://host.docker.internal:5001/default
        send_resolved: true
  - name: critical
    webhook_configs:
      - url: http://host.docker.internal:5001/critical
        send_resolved: true
  - name: warning
    webhook_configs:
      - url: http://host.docker.internal:5001/warning
        send_resolved: true

  # Real-world examples, replace a webhook above with one of these:
  #
  # - name: critical
  #   slack_configs:
  #     - api_url: https://hooks.slack.com/services/XXX/YYY/ZZZ
  #       channel: "#alerts"
  #       send_resolved: true
  #       title: "{{ .CommonLabels.alertname }} ({{ .Status }})"
  #       text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
  #
  # - name: warning
  #   email_configs:
  #     - to: you@example.com
  #       from: alertmanager@example.com
  #       smarthost: smtp.gmail.com:587
  #       auth_username: you@example.com
  #       auth_password: <app-password>
