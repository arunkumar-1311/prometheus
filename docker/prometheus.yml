global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

# Send firing alerts to Alertmanager (service name from docker-compose.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pprof-demo
    metrics_path: /metrics
    static_configs:
      # The Go app runs on the host; host.docker.internal is mapped in docker-compose.yml.
      - targets: ["host.docker.internal:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
